<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--key:hsl(var(--h) 14% 30%);

html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:24px 16px 32px;text-align:center}
h1{margin:0 0 6px;font-size:28px}
.sub{margin:0 auto 22px;max-width:420px;line-height:1.4;color:var(--mute);font-size:15px}
.top{display:flex;justify-content:space-between;font-weight:700;margin:0 4px 16px}
.q{background:var(--panel);border:2px solid var(--pur);border-radius:12px;padding:16px;font-size:20px;font-weight:600;margin:0 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;background:hsl(var(--h) 95% 66%);color:hsl(var(--h) 60% 10%);border-radius:8px;padding:12px 14px;margin:8px 0;font-weight:700;font-size:18px;text-align:left}
.row .n{width:28px;opacity:.7}.row .a{flex:1;text-transform:capitalize}
.row.hid{background:var(--key);color:var(--mute)}
.row.hid .a{text-transform:none;letter-spacing:4px;font-weight:400}.row.hid .a:after{content:"\00b7 \00b7 \00b7 \00b7 \00b7"}
.in{display:flex;gap:10px;margin-top:16px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 14px;border-radius:8px;border:2px solid var(--mute);background:transparent;color:var(--ink)}
input:focus{outline:none;border-color:var(--pur)}
button{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:0;background:var(--pur);color:#1a1033;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:2px solid var(--mute)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled,input:disabled{opacity:.4;cursor:not-allowed}
.msg{min-height:26px;font-weight:600;margin:14px 0 0}
.in.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.end{margin-top:18px;display:flex;gap:10px;justify-content:center}
.row.miss{background:hsl(var(--h) 25% 38%);color:var(--ink)}
.row.hid.hinted{color:var(--ink)}
.row.hid.hinted .a{letter-spacing:3px;font-weight:600}
.row.hid.hinted .a:after{content:none}
.row.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.7) rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
</style></head><body><main>
<h1>Survey Says</h1>
<p class="sub">Guess the most popular survey answers. Find them all to clear the board.</p>
<div class="top" hidden><span id="sc"></span></div>
<div class="q" id="q"></div>
<div id="board"></div>

<div class="msg" id="msg"></div>
<div class="in"><input id="g" placeholder="Type your answer…" autocomplete="off"><button id="go">Guess</button></div>
<div class="end"><button class="alt" id="next">Next question</button><button class="alt" id="hint">Hint</button><button class="alt" id="give">Give up</button></div>
</main>

$("sc").textContent="Score: "+score;$("give").disabled=true;$("hint").disabled=true;if(win)confetti()}
function guess(){if(over)return;const v=norm($("g").value);$("g").value="";if(!v)return;const ans=Q[r][1];
let hit=-1;ans.forEach((a,i)=>{if(hit<0&&[a[0],...a[2]].some(t=>same(v,t)))hit=i});
if(hit>=0){if(found.includes(hit)){$("msg").textContent="Already on the board.";return}
found.push(hit);score+=ans[hit][1];$("msg").textContent="Survey says… +"+ans[hit][1]+"!";$("sc").textContent="Score: "+score;draw(false,hit);ding();
if(found.length===ans.length)finish(true)}
else{$("msg").textContent="Not on the board. Try again!";buzz();shake()}}
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
$("give").onclick=()=>{if(!over){finish(false);$("msg").textContent="You gave up. Here are the answers."}};
let ac;
function beep(f,at,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+at;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function buzz(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();beep(110,0,.55,"sawtooth",.25);beep(104,0,.55,"square",.1)}catch(e){}}
function ding(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();beep(880,0,.3,"sine",.2);beep(1320,.12,.45,"sine",.2)}catch(e){}}
function shake(){const e=document.querySelector(".in");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
$("hint").onclick=()=>{if(over)return;const ans=Q[r][1];const c=ans.map((a,i)=>i).filter(i=>!found.includes(i)&&!hints[i]);
if(!c.length){$("msg").textContent="All remaining answers already have a hint.";return}
const i=c[Math.random()*c.length|0],w=ans[i][0];hints[i]=w.split("").map((ch,j)=>ch===" "?"\u00a0\u00a0":(j===0?ch.toUpperCase():"_")).join(" ");
$("msg").textContent="Hint: one answer starts with "+w[0].toUpperCase()+" and has "+w.replace(/ /g,"").length+" letters.";draw();$("g").focus()};
$("go").onclick=guess;$("g").addEventListener("keydown",e=>{if(e.key==="Enter")guess()});
$("next").onclick=load;
load();
</script></body></html>
