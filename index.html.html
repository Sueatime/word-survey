<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Survey Says</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Rubik+Doodle+Shadow&display=swap" rel="stylesheet">
<style>
:root{--h:260;--bg:hsl(var(--h) 30% 9%);--panel:hsl(var(--h) 26% 15%);--ink:hsl(var(--h) 60% 95%);--mute:hsl(var(--h) 20% 68%);--pur:hsl(var(--h) 70% 68%);--key:hsl(var(--h) 14% 30%);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-size:18px;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 16px 40px;text-align:center;display:flex;flex-direction:column;min-height:100vh}
h1{margin:0 0 8px;font-family:"Rubik Doodle Shadow","Outfit",system-ui,sans-serif;font-weight:400;font-size:clamp(30px,9.5vw,44px);letter-spacing:1px;line-height:1.1}
.sub{margin:0 0 14px;color:var(--mute);font-size:18px}
.q{background:var(--panel);border:2px solid var(--pur);border-radius:12px;padding:14px;font-size:21px;font-weight:600;margin:0 0 6px}
#msg{min-height:26px;font-weight:600;margin:8px 0 8px}
#board.shake{animation:shake .4s}
.row{display:flex;justify-content:space-between;align-items:center;background:hsl(var(--h) 95% 66%);color:hsl(var(--h) 60% 10%);border:2px solid transparent;border-radius:8px;padding:10px 14px;margin:8px 0;font-weight:700;text-align:left;cursor:pointer}
.row .n{width:30px;opacity:.7}.row .a{flex:1;text-transform:capitalize}
.row.hid{background:var(--key);color:var(--mute)}
.row.hid .a{text-transform:none;letter-spacing:4px;font-weight:400}
.row.hid .a:after{content:"\00b7 \00b7 \00b7 \00b7 \00b7"}
.row.hid.hinted{color:var(--ink)}
.row.hid.hinted .a{letter-spacing:3px;font-weight:600}
.row.hid.hinted .a:after{content:none}
.row.hid.act{border-color:var(--pur);color:var(--ink)}
.row.hid .a.t{white-space:pre;text-transform:uppercase;letter-spacing:2px;font-weight:700;color:var(--ink)}
.row.hid .a.t:after{content:"";display:inline-block;width:2px;height:1em;background:var(--pur);vertical-align:-.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.row.miss{background:hsl(var(--h) 25% 38%);color:var(--ink)}
.row.pop{animation:rowpop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rowpop{0%{transform:scale(.7) rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}
button{font:inherit;font-weight:600;cursor:pointer}
.acts button{padding:10px 18px;border-radius:8px;background:transparent;color:var(--ink);border:2px solid var(--mute)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.hidin{position:fixed;left:0;bottom:0;width:1px;height:1px;padding:0;margin:0;border:0;opacity:0;pointer-events:none;font-size:16px}
.win{background:var(--pur);color:#fff;border-radius:10px;padding:12px;font-size:22px;font-weight:800;max-width:420px;margin:0 auto;animation:winpop .5s ease-out;word-break:break-word}
.win div+div{margin-top:6px}
@keyframes winpop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.win,.row.pop,#board.shake{animation:none}}
@media (min-width:800px){
body{font-size:26px}
main{max-width:820px;padding-top:32px}
h1{font-size:66px;margin-bottom:12px}
.sub{font-size:25px}
.q{font-size:30px;padding:18px}
.row{padding:14px 22px}
.row .n{width:42px}
.acts button{padding:14px 30px}
.win{font-size:30px;max-width:620px}
#msg{min-height:40px}
}
</style>
</head>

const $=i=>document.getElementById(i);
const norm=s=>s.toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function same(v,t){t=norm(t);if(!t)return false;const ts=t.replace(/s$/,"");return [v,v.replace(/s$/,"")].some(x=>x===t||x===ts||(x.length>3&&(t.includes(x)||(t.length>3&&x.includes(t))))||(x.length>4&&t.length>4&&lev(x,t)<=1))}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let r=-1,found=[],over=false,deck=[],hue=-1,hints={},names=[],round=0,ac,active=0,typed="";
const HUES=[0,20,35,45,95,125,150,205,225,245,260,280,300,320,340];
const inp=$("inp");
function beep(f,at,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;const t=ac.currentTime+at;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function buzz(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();beep(110,0,.55,"sawtooth",.25);beep(104,0,.55,"square",.1)}catch(e){}}
function ding(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();beep(880,0,.3,"sine",.2);beep(1320,.12,.45,"sine",.2)}catch(e){}}
function shake(){const e=$("board");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}
function pname(){try{return (new URLSearchParams(location.search).get("name")||window.playerName||"").trim().slice(0,30)}catch(e){return""}}
function nextActive(from){const n=Q[r][1].length;for(let k=1;k<=n;k++){const i=(from+k)%n;if(!found.includes(i))return i}return -1}
function draw(reveal,anim){const ans=Q[r][1];let k=0;
$("board").innerHTML=ans.map((a,i)=>{const f=found.includes(i),s=f||reveal,m=reveal&&!f,act=!s&&!over&&i===active;
const cls=(s?"":"hid ")+(!s&&hints[i]?"hinted ":"")+(act?"act ":"")+(m?"miss ":"")+((anim===i||m)?"pop":"");
const d=m?` style="animation-delay:${(k++)*.18}s"`:"";
const txt=s?esc(a[0]):(act?(esc(typed)||hints[i]||""):(hints[i]||""));
return `<div class="row ${cls}" data-i="${i}"${d}><span class="n">${i+1}</span><span class="a${act?" t":""}">${txt}</span><span class="p">${s?a[1]:""}</span></div>`}).join("")}
function list(a){return a.length<2?a.join(""):a.slice(0,-1).join("\u2019, \u2018")+"\u2019 and \u2018"+a[a.length-1]}
function winPopup(){const g={},order=[];names.forEach(x=>{if(!g[x.n]){g[x.n]=[];order.push(x.n)}g[x.n].push(x.w.toUpperCase())});
const d=document.createElement("div");d.className="win";
order.forEach(n=>{const p=document.createElement("div");p.textContent=n+" won with \u2018"+list(g[n])+"\u2019";d.appendChild(p)});
const m=$("msg");m.textContent="";m.appendChild(d)}
function fi(){try{inp.focus({preventScroll:true});inp.setSelectionRange(inp.value.length,inp.value.length)}catch(e){}}
function newGame(){round++;
if(!deck.length)deck=Q.map((_,i)=>i).sort(()=>Math.random()-.5);r=deck.pop();
let h;do{h=HUES[Math.random()*HUES.length|0]}while(h===hue);hue=h;document.documentElement.style.setProperty("--h",h);
over=false;found=[];hints={};names=[];typed="";active=0;
$("q").textContent=Q[r][0];$("msg").textContent="";
$("hint").disabled=false;$("give").disabled=false;
draw();fi()}
function finish(win){over=true;$("hint").disabled=true;$("give").disabled=true;typed="";
if(win){winPopup();confetti();const t=round;setTimeout(function(){if(over&&round===t)newGame()},8000)}
else{draw(true);$("msg").textContent="Here are the answers."}}
function submit(text,name,remote){
if(over)return;const v=norm(String(text||"").slice(0,60));if(!v)return;
const ans=Q[r][1];let hit=-1;
ans.forEach((a,i)=>{if(hit<0&&[a[0],...a[2]].some(t=>same(v,t)))hit=i});
if(hit>=0){
if(found.includes(hit)){if(!remote)$("msg").textContent="Already on the board.";return}
found.push(hit);const n=String(name||pname()||"Player").trim().slice(0,30);
names.push({n:n,w:ans[hit][0]});
if(found.length===ans.length){draw(false,hit);ding();finish(true);return}
if(found.includes(active))active=nextActive(active);
$("msg").textContent="";draw(false,hit);ding()}
else if(!remote){$("msg").textContent="Not on the board. Try again!";buzz();shake()}}
function giveUp(){if(over)return;finish(false)}
function hint(){if(over)return;const ans=Q[r][1];
const c=ans.map((a,i)=>i).filter(i=>!found.includes(i)&&!hints[i]);
if(!c.length){$("msg").textContent="All remaining answers already have a hint.";return}
const i=c[Math.random()*c.length|0],w=ans[i][0],L=w.length;
hints[i]=w.split("").map((ch,j)=>ch===" "?"\u00a0\u00a0":((j===0||j===L-1)?ch.toUpperCase():"_")).join(" ");
$("msg").textContent="Hint: one answer starts with "+w[0].toUpperCase()+" and ends with "+w[L-1].toUpperCase()+".";
draw();fi()}
function remote(word,name){submit(word,name,true)}
window.submitGuess=remote;
window.addEventListener("message",function(e){var d=e.data;if(d&&d.type==="guess")remote(d.word,d.name)});
var LIVE=/[?&]live=1/.test(location.search)||location.protocol==="file:";
function tikfinity(){var ws;try{ws=new WebSocket("ws://127.0.0.1:21213/")}catch(e){return}
ws.onmessage=function(ev){try{var m=JSON.parse(ev.data),d=m.data||m;if(!/chat|comment/i.test(String(m.event||m.type||"")))return;var u=d.user||{};remote(d.comment||d.text||d.message,d.nickname||d.uniqueId||u.nickname||u.uniqueId)}catch(e){}};
ws.onclose=function(){setTimeout(tikfinity,3000)};ws.onerror=function(){ws.close()}}
if(LIVE)tikfinity();
function confetti(){
if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
const c=document.createElement("canvas");c.id="confetti";c.width=innerWidth;c.height=innerHeight;document.body.append(c);
const x=c.getContext("2d"),cols=[0,45,150,200,260,320].map(h=>`hsl(${h} 85% 55%)`);
const ps=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:6+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
let t=0;
(function f(){
x.clearRect(0,0,c.width,c.height);t++;
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(t<160)requestAnimationFrame(f);else c.remove();
})();
}
/* typing: straight into the board, no input box */
function add(ch){if(over||active<0)return;if(typed.length<28){typed+=ch;draw()}}
function del(){if(over)return;typed=typed.slice(0,-1);draw()}
function enter(){if(over)return;const v=typed;typed="";draw();submit(v,"",false)}
document.addEventListener("keydown",function(e){
if(e.ctrlKey||e.metaKey||e.altKey)return;
if(e.key==="Enter"){e.preventDefault();enter()}
else if(e.key==="Backspace"){e.preventDefault();del()}
else if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(over)return;e.preventDefault();const n=Q[r][1].length;let i=active;for(let k=0;k<n;k++){i=(i+(e.key==="ArrowDown"?1:n-1))%n;if(!found.includes(i)){active=i;draw();break}}}
else if(/^[a-zA-Z ]$/.test(e.key)){if(e.target&&e.target.tagName==="BUTTON"&&e.key===" ")return;e.preventDefault();add(e.key.toLowerCase())}});
inp.addEventListener("input",function(){var v=inp.value;
if(v.length===0)del();
else{var s=v.charAt(0)===" "?v.slice(1):v;s.toLowerCase().replace(/[^a-z ]/g,"").split("").forEach(add)}
inp.value=" ";fi()});
$("board").addEventListener("click",function(e){var row=e.target.closest(".row");if(!row||over)return;var i=+row.dataset.i;if(!found.includes(i)){active=i;draw()}fi()});
document.addEventListener("pointerdown",function(e){if(!e.target.closest("button"))fi()});
window.addEventListener("focus",fi);
$("new").onclick=newGame;$("hint").onclick=hint;$("give").onclick=giveUp;
newGame();
